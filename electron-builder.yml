appId: com.codeos.app
productName: CODE OS
directories:
  output: release

asar: true
asarUnpack:
  - "**/node_modules/node-pty/**"

compression: "maximum"
electronLanguages:
  - "en-US"
  - "en-GB"

afterSign: "scripts/verify-release-signing.js"

files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "package.json"

extraResources:
  # Bundled runtimes: python/, node/, git/, tiktoken/, backend/
  - from: "resources/python"
    to: "python"
    filter:
      - "**/*"
  - from: "resources/node"
    to: "node"
    filter:
      - "**/*"
  - from: "resources/git"
    to: "git"
    filter:
      - "**/*"
  - from: "resources/tiktoken"
    to: "tiktoken"
    filter:
      - "**/*"
  - from: "backend/app"
    to: "backend/app"
    filter:
      - "**/*"
  - from: "backend/watchdog_launcher.py"
    to: "backend/watchdog_launcher.py"
  - from: "backend/dist/backend"
    to: "backend"
    filter:
      - "**/*"

win: # target: nsis, icon configured
  icon: "build/icon.ico"
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: "${productName}-${version}-win.${ext}"
  signingHashAlgorithms:
    - sha256

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "CODE OS"
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
  artifactName: "${productName} Setup ${version}.${ext}"
  runAfterFinish: true
  differentialPackage: false

portable:
  artifactName: "${productName}-${version}-portable.${ext}"

linux: # target: AppImage and deb
  icon: "build/icon.png"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  maintainer: "Roopesh Kosuri <roopesh@codeos.ai>"
  artifactName: "${productName}-${version}-${arch}.${ext}"

appImage:
  artifactName: "${productName}-${version}-x86_64.${ext}"

deb:
  artifactName: "${name}_${version}_${arch}.${ext}"

mac:
  icon: "build/icon.png"
  extraResources:
    - from: "build/python-runtime/darwin/python"
      to: "python"
      filter:
        - "**/*"
    - from: "build/node-runtime/darwin/node"
      to: "node"
      filter:
        - "**/*"
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: "build/entitlements.mac.plist"
  entitlementsInherit: "build/entitlements.mac.inherit.plist"
  notarize:
    teamId: "${APPLE_TEAM_ID}"
  artifactName: "${productName}-${version}-${os}-${arch}${env.MAC_BUILD_SUFFIX}.${ext}"
