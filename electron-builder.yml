appId: com.codeos.app
productName: CODE OS
directories:
  output: release

asarUnpack:
  - "**/node_modules/node-pty/**"

afterSign: "scripts/verify-release-signing.js"

files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "package.json"

extraResources:
  - from: "backend/dist/backend"
    to: "backend"
    filter:
      - "**/*"

win:
  icon: "build/icon.ico"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  sign:
    cscLink: "${CSC_LINK}"
    cscKeyPassword: "${CSC_KEY_PASSWORD}"
    certificateFile: "${CSC_LINK}"
    certificatePassword: "${CSC_KEY_PASSWORD}"
    signingHashAlgorithms:
      - sha256

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "CODE OS"
  runAfterFinish: true
  differentialPackage: false

portable:
  artifactName: "${productName}-${version}-portable.${ext}"

linux:
  icon: "build/icon.png"
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  maintainer: "Roopesh Kosuri <roopesh@codeos.ai>"
  afterSign: "scripts/verify-release-signing.js"

mac:
  icon: "build/icon.png"
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  appleId: "${APPLE_ID}"
  appleIdPassword: "${APPLE_APP_SPECIFIC_PASSWORD}"
