appId: com.codeos.app
productName: CODE OS
directories:
  output: release

asarUnpack:
  - "**/node_modules/node-pty/**"

afterSign: "scripts/verify-release-signing.js"

files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "package.json"

extraResources:
  - from: "backend/dist/backend"
    to: "backend"
    filter:
      - "**/*"
  - from: "build/tiktoken"
    to: "tiktoken"
    filter:
      - "**/*"

win:
  icon: "build/icon.ico"
  extraResources:
    - from: "build/python-runtime/win/python"
      to: "python"
      filter:
        - "**/*"
    - from: "build/node-runtime/win/node"
      to: "node"
      filter:
        - "**/*"
    - from: "build/git-runtime/win/git"
      to: "git"
      filter:
        - "**/*"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  sign:
    cscLink: "${CSC_LINK}"
    cscKeyPassword: "${CSC_KEY_PASSWORD}"
    certificateFile: "${CSC_LINK}"
    certificatePassword: "${CSC_KEY_PASSWORD}"
    signingHashAlgorithms:
      - sha256

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "CODE OS"
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
  artifactName: "${productName}-${version}-setup.${ext}"
  runAfterFinish: true
  differentialPackage: false

portable:
  artifactName: "${productName}-${version}-portable.${ext}"

linux:
  icon: "build/icon.png"
  extraResources:
    - from: "build/python-runtime/linux/python"
      to: "python"
      filter:
        - "**/*"
    - from: "build/node-runtime/linux/node"
      to: "node"
      filter:
        - "**/*"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  maintainer: "Roopesh Kosuri <roopesh@codeos.ai>"
  artifactName: "${productName}-${version}-${arch}.${ext}"
  afterSign: "scripts/verify-release-signing.js"

mac:
  icon: "build/icon.png"
  extraResources:
    - from: "build/python-runtime/darwin/python"
      to: "python"
      filter:
        - "**/*"
    - from: "build/node-runtime/darwin/node"
      to: "node"
      filter:
        - "**/*"
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: "build/entitlements.mac.plist"
  entitlementsInherit: "build/entitlements.mac.inherit.plist"
  identity: "${CSC_LINK}"
  notarize: true
  appleId: "${APPLE_ID}"
  appleIdPassword: "${APPLE_APP_SPECIFIC_PASSWORD}"
  teamId: "${APPLE_TEAM_ID}"
  artifactName: "${productName}-${version}-${os}-${arch}${env.MAC_BUILD_SUFFIX}.${ext}"
