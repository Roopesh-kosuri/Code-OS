name: Continuous Integration

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  security-gates:
    name: Security Gates (SAST & Vulnerability Auditing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary bandit==1.7.5 pip-audit==2.10.1 safety
          pip install --prefer-binary -r backend/requirements.txt
          npm install

      - name: Verify Security Exceptions Registry
        run: python scripts/verify_security_exceptions.py
        continue-on-error: false

      - name: Python SAST (Bandit)
        run: bandit -r backend/ -c pyproject.toml -lll || python scripts/verify_security_exceptions.py bandit
        continue-on-error: false

      - name: Python Dependency Audit (pip-audit)
        run: pip-audit -r backend/requirements.txt || python scripts/verify_security_exceptions.py pip-audit
        continue-on-error: false

      - name: Frontend Dependency Audit (npm audit)
        run: npm audit --audit-level=high || python scripts/verify_security_exceptions.py npm-audit
        continue-on-error: false

      - name: Secondary Python Dependency Check (Safety)
        run: safety check || python scripts/verify_security_exceptions.py safety
        continue-on-error: false

  ci-checks:
    name: Frontend and Backend CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [security-gates]
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config xvfb

      - name: Install Backend Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary pytest pytest-asyncio pytest-cov pyinstaller
          pip install --prefer-binary -r backend/requirements.txt

      - name: Verify Tiktoken Dev Gate
        run: |
          python -c "import tiktoken; enc = tiktoken.get_encoding('cl100k_base'); assert len(enc.encode('hello world 🚀 宇宙')) > 0, 'tiktoken encoding failed'"

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run TypeScript Typechecks
        run: npm run typecheck

      - name: Compile Production App Build
        run: npm run build

      - name: Run backend tests with coverage
        run: |
          xvfb-run -a pytest backend/tests --cov=app.core.security \
                               --cov=app.core.paths \
                               --cov=app.core.rate_limiter \
                               --cov=app.features.ai.sandbox.policy \
                               --cov-fail-under=80 -v
        env:
          PYTHONPATH: backend

  mac-release-build:
    name: macOS Release Build, Sign, Notarize & Gatekeeper Verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [security-gates]
    strategy:
      matrix:
        os: [macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r backend/requirements.txt
          npm install

      - name: Build macOS Artifacts
        run: npm run build:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify Gatekeeper Assessment (spctl)
        run: |
          echo "Running Gatekeeper verification via spctl on built application..."
          spctl --assess -vv --type install release/mac*/"CODE OS.app" || spctl -a -vv -t install release/mac*/"CODE OS.app"
        continue-on-error: false

      - name: Guard Release Channel Artifacts
        run: node scripts/release-guard.js --channel=release release
        continue-on-error: false

  release-signing-verification:
    name: Release Signing Verification
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci-checks, security-gates, mac-release-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Release Signing Script Exists
        run: test -f scripts/verify-release-signing.js

      - name: Verify Release Artifact Signatures
        run: node scripts/verify-release-signing.js --strict release
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
