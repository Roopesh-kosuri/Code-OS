name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-checks:
    name: Frontend and Backend CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config xvfb

      - name: Install Backend Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary pytest pytest-asyncio pytest-cov pyinstaller bandit pip-audit
          pip install --prefer-binary -r backend/requirements.txt

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run TypeScript Typechecks
        run: npm run typecheck

      - name: Run Bandit (Python security linter)
        run: bandit -r backend/app -f json -o bandit-report.json
        continue-on-error: true

      - name: Run pip-audit (dependency vulnerabilities)
        run: pip-audit --format json --output pip-audit-report.json
        continue-on-error: true

      - name: Run npm audit (frontend dependencies)
        run: npm audit --json > npm-audit-report.json
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
            npm-audit-report.json

      - name: Fail on critical vulnerabilities
        run: |
          if grep -q '"severity": "HIGH"' bandit-report.json; then
            echo "High-severity Python vulnerabilities found"
            exit 1
          fi
          if grep -q '"severity": "critical"' npm-audit-report.json; then
            echo "Critical npm vulnerabilities found"
            exit 1
          fi

      - name: Compile Production App Build
        run: npm run build

      - name: Run backend tests with coverage
        run: |
          xvfb-run -a pytest backend/tests --cov=app.core.security \
                               --cov=app.core.paths \
                               --cov=app.core.rate_limiter \
                               --cov=app.features.ai.sandbox.policy \
                               --cov-fail-under=80 -v
        env:
          PYTHONPATH: backend
