name: Continuous Integration

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  security-gates:
    name: Security Gates (SAST & Vulnerability Auditing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary bandit==1.7.5 pip-audit==2.10.1 safety
          pip install --prefer-binary -r backend/requirements.txt
          npm install

      - name: Verify Security Exceptions Registry
        run: python scripts/verify_security_exceptions.py
        continue-on-error: false

      - name: Python SAST (Bandit)
        run: bandit -r backend/ -c pyproject.toml -lll || python scripts/verify_security_exceptions.py bandit
        continue-on-error: false

      - name: Python Dependency Audit (pip-audit)
        run: pip-audit -r backend/requirements.txt || python scripts/verify_security_exceptions.py pip-audit
        continue-on-error: false

      - name: Frontend Dependency Audit (npm audit)
        run: npm audit --audit-level=high || python scripts/verify_security_exceptions.py npm-audit
        continue-on-error: false

      - name: Secondary Python Dependency Check (Safety)
        run: safety check || python scripts/verify_security_exceptions.py safety
        continue-on-error: false

  ci-checks:
    name: Frontend and Backend CI Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [security-gates]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config xvfb

      - name: Install Backend Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary pytest pytest-asyncio pytest-cov pyinstaller
          pip install --prefer-binary -r backend/requirements.txt

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run TypeScript Typechecks
        run: npm run typecheck

      - name: Compile Frontend and Electron Main
        run: |
          npm run build:vite
          npm run build:electron

      - name: Run Backend Regression Test Suite
        run: |
          python -m pytest backend/tests/test_paths.py backend/tests/test_rate_limiter_enforcement.py backend/tests/test_rate_limiter_precheck.py backend/tests/test_security_suite.py backend/tests/test_sandbox_policy.py backend/tests/test_phase17_s2_fixes.py backend/tests/test_phase16_fixes.py backend/tests/test_phase15_benchmarks_and_release.py -v
        env:
          PYTHONPATH: backend

  benchmarks:
    name: Benchmark Gym (Deterministic OSS Tasks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary pytest pytest-asyncio
          pip install --prefer-binary -r backend/requirements.txt
          npm install

      - name: Run Benchmark Gym (Simple Suite)
        run: |
          python -m benchmarks.run --suite simple --dry-run
          cat release/benchmark_results.md >> $GITHUB_STEP_SUMMARY || true

      - name: Generate SBOM
        run: python scripts/generate_sbom.py

      - name: Generate Production Release Notes
        run: python scripts/generate_release_notes.py


