name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-checks:
    name: Frontend and Backend CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config xvfb

      - name: Install Backend Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary pytest pytest-asyncio pytest-cov pyinstaller bandit pip-audit
          pip install --prefer-binary -r backend/requirements.txt

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run TypeScript Typechecks
        run: npm run typecheck

      - name: Run Bandit (Python security linter)
        run: bandit -r backend/app -f json -o bandit-report.json || true

      - name: Run pip-audit (Python dependency vulnerabilities)
        run: pip-audit --format json --output pip-audit-report.json || true

      - name: Run npm audit (Frontend dependencies)
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
            npm-audit-report.json

      - name: Compile Production App Build
        run: npm run build

      - name: Run Python Test Suite with Coverage
        run: xvfb-run -a python -m pytest backend/tests --cov=app --cov-fail-under=50 -v
        env:
          PYTHONPATH: backend
