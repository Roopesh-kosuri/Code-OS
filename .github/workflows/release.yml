name: Multi-Platform Release Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v3.0.0)'
        required: false
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Install Node Dependencies
        run: npm install

      - name: Compile Backend PyInstaller Standalone Binary
        run: npm run build:backend-exe

      - name: Compile Frontend & Electron Main
        run: |
          npm run build:vite
          npm run build:electron
          npm run download:runtimes

      - name: Package with Electron-Builder
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npx electron-builder --win nsis portable --publish never
          elif [ "${{ runner.os }}" = "macOS" ]; then
            npx electron-builder --mac dmg zip --publish never
          else
            npx electron-builder --linux AppImage deb tar.gz --publish never
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Installer Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name || 'v3.0.0' }}
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
